<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stress Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .result h3 {
            color: #007bff;
            margin-bottom: 12px;
            text-align: center;
        }

        .result p {
            margin: 8px 0;
            font-size: 15px;
        }

        .suggestion {
            margin-top: 15px;
            padding: 12px;
            background: #e8f4ff;
            border-left: 5px solid #007bff;
            border-radius: 6px;
        }

        .suggestion strong {
            display: block;
            margin-bottom: 6px;
            color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Stress Predictor</h2>

        <form action="/predict" method="POST">

            <input type="number" name="age" placeholder="Enter Age" required>

            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <select name="occupation" required>
                <option value="">Select Occupation</option>
                <option value="Student">Student</option>
                <option value="Employee">Employee</option>
                <option value="Freelancer">Freelancer</option>
            </select>

            <input type="number" step="0.1" name="sleep" placeholder="Sleep Hours" required>

            <input type="number" step="0.1" name="work" placeholder="Work Hours" required>

            <input type="number" step="0.1" name="activity" placeholder="Physical Activity Hours" required>

            <input type="number" step="0.1" name="screen" placeholder="Screen Time Hours" required>

            <button type="submit">Predict Stress</button>

        </form>

        {% if prediction %}

        <div class="result">

            <h3>Prediction Result</h3>

            <p><strong>Stress Level:</strong> {{ prediction }}</p>

            <p><strong>Stress Score:</strong> {{ score }}</p>

            <div class="suggestion">
                <strong>Suggestion From Model:</strong>
                <p>{{ suggestion }}</p>
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
